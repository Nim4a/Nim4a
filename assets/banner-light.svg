<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5f8ff"/>
      <stop offset="100%" stop-color="#f8f4ff"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".08"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity=".06"/>
      <animate attributeName="x1" values="-0.5;0.5;-0.5" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1.5;0.5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
      <animate attributeName="x1" values="-0.4;1.2;-0.4" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;1.9;0.3" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#2563eb" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#aurora)"/>

  <!-- animated mark: orbiting satellites around a pulsing core -->
  <g transform="translate(92 118)">
    <!-- soft halo -->
    <circle r="26" fill="url(#nameGrad)" opacity=".12">
      <animate attributeName="r" values="24;32;24" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- outer orbit: two satellites -->
    <circle r="30" fill="none" stroke="#2563eb" stroke-opacity=".22" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="30" cy="0" r="2.6" fill="#2563eb"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="9s" repeatCount="indefinite"/>
      <circle cx="30" cy="0" r="1.8" fill="#0891b2"/>
    </g>
    <!-- inner orbit: counter-rotating dashed ring + one satellite -->
    <circle r="19" fill="none" stroke="#7c3aed" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <circle cx="19" cy="0" r="2.1" fill="#8b5cf6"/>
    </g>
    <!-- pulsing core -->
    <circle r="10" fill="url(#nameGrad)">
      <animate attributeName="r" values="9.5;11.5;9.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#ffffff"/>
  </g>

  <!-- name -->
  <text x="150" y="128" font-size="56" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1">Nima Asbagh</text>

  <!-- role -->
  <text x="152" y="164" font-size="14" fill="#5b6b85" letter-spacing="3.2">WINDOWS SOFTWARE · RUST / PYTHON / TYPESCRIPT</text>

  <!-- pitch -->
  <text x="152" y="198" font-size="15.5" fill="#7c8aa1">Photo viewers, notepads, sidebar gadgets — and Cloudflare Workers.</text>

  <!-- rule -->
  <rect x="150" y="222" width="900" height="1.5" rx=".75" fill="url(#rule)">
    <animate attributeName="opacity" values=".3;.8;.3" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal card -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    <rect x="812" y="78" width="336" height="102" rx="10" fill="#0f172a"/>
    <circle cx="832" cy="98" r="3" fill="#ff5f57"/>
    <circle cx="846" cy="98" r="3" fill="#febc2e"/>
    <circle cx="860" cy="98" r="3" fill="#28c840"/>
    <text x="832" y="128" fill="#93a9d1">$ cargo build --release<tspan font-size="12">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>
    <circle cx="833" cy="150" r="3.5" fill="#4ade80">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="845" y="155" fill="#7dd3a8">Finished · picoSun2 v2.2.0</text>
  </g>
</svg>
