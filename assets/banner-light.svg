<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcfdfa"/>
      <stop offset="55%" stop-color="#f4f8f3"/>
      <stop offset="100%" stop-color="#f7f9f4"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d5b" stop-opacity=".08"/>
      <stop offset="50%" stop-color="#1d6b4f" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#4a9a74" stop-opacity=".06"/>
      <animate attributeName="x1" values="-0.5;0.5;-0.5" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;1.5;0.5" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#13291f"/>
      <stop offset="55%" stop-color="#1a5c40"/>
      <stop offset="100%" stop-color="#0f3d2d"/>
      <animate attributeName="x1" values="-0.4;1.2;-0.4" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;1.9;0.3" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d5b" stop-opacity="0"/>
      <stop offset="35%" stop-color="#2e7d5b" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#14523c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#14523c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="47" height="43" patternUnits="userSpaceOnUse">
      <path d="M47 0H0V43" fill="none" stroke="#1d6b4f" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="280" rx="16" fill="url(#aurora)"/>

  <!-- animated mark: orbiting satellites around a pulsing core -->
  <g transform="translate(92 118)">
    <!-- soft halo -->
    <circle r="26" fill="url(#nameGrad)" opacity=".12">
      <animate attributeName="r" values="24;32;24" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- outer orbit: two satellites -->
    <circle r="30" fill="none" stroke="#1d6b4f" stroke-opacity=".22" stroke-width="1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
      <circle cx="30" cy="0" r="2.6" fill="#1d6b4f"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="9s" repeatCount="indefinite"/>
      <circle cx="30" cy="0" r="1.8" fill="#3d9970"/>
    </g>
    <!-- inner orbit: counter-rotating dashed ring + one satellite -->
    <circle r="19" fill="none" stroke="#14523c" stroke-opacity=".45" stroke-width="1.3" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <circle cx="19" cy="0" r="2.1" fill="#2e8b68"/>
    </g>
    <!-- pulsing core -->
    <circle r="10" fill="url(#nameGrad)">
      <animate attributeName="r" values="9.5;11.5;9.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#fcfdfa"/>
  </g>

  <!-- name -->
  <text x="149" y="130" font-size="56" font-weight="700" fill="url(#nameGrad)" letter-spacing="-1">Nima Asbagh</text>

  <!-- role -->
  <text x="152" y="164" font-size="13" fill="#5c6b60" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" letter-spacing="2.4">RUST · PYTHON · TYPESCRIPT</text>

  <!-- pitch -->
  <text x="152" y="198" font-size="15.5" fill="#75806f">Photo viewers, a notepad, sidebar gadgets — and some Cloudflare Workers.</text>

  <!-- rule -->
  <rect x="150" y="221" width="778" height="1.5" rx=".75" fill="url(#rule)">
    <animate attributeName="opacity" values=".3;.8;.3" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- terminal card -->
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13">
    <rect x="816" y="80" width="332" height="100" rx="9" fill="#13291f"/>
    <circle cx="835" cy="99" r="2.8" fill="#ff5f57"/>
    <circle cx="848" cy="100" r="2.6" fill="#febc2e"/>
    <circle cx="861" cy="99" r="2.7" fill="#28c840"/>
    <text x="834" y="129" fill="#93a9d1">$ cargo build --release<tspan font-size="12">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>
    <circle cx="836" cy="151" r="3.2" fill="#4ade80">
      <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="847" y="156" fill="#7dd3a8">warning: unused import · 1.2s</text>
  </g>
</svg>
