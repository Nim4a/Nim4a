<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1b1430"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f0ff"/>
      <stop offset="48%" stop-color="#8ab4ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
      <animate attributeName="x1" values="-0.3;1.1;-0.3" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;1.8;0.4" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#60a5fa" stop-opacity=".9"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ab4ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>

  <g filter="url(#soft)">
    <circle cx="150" cy="40" r="220" fill="url(#glow1)">
      <animate attributeName="cx" values="150;260;150" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;120;40" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="230" r="240" fill="url(#glow2)">
      <animate attributeName="cx" values="1050;930;1050" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;160;230" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="0" r="180" fill="url(#glow3)">
      <animate attributeName="cx" values="620;760;620" dur="13s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#cfe0ff">
    <circle cx="120" cy="200" r="1.6" opacity=".7"><animate attributeName="opacity" values=".15;.85;.15" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="60" r="1.4" opacity=".5"><animate attributeName="opacity" values=".8;.15;.8" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="220" r="1.8" opacity=".6"><animate attributeName="opacity" values=".2;.9;.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="54" r="1.3" opacity=".5"><animate attributeName="opacity" values=".7;.1;.7" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="210" r="1.5" opacity=".6"><animate attributeName="opacity" values=".15;.8;.15" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="90" r="1.7" opacity=".55"><animate attributeName="opacity" values=".8;.2;.8" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="140" r="1.1" opacity=".4"><animate attributeName="opacity" values=".3;.9;.3" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="150" r="1.2" opacity=".45"><animate attributeName="opacity" values=".9;.25;.9" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(72 96)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#60a5fa" stroke-opacity=".85" stroke-width="2">
      <animate attributeName="r" values="26;30;26" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#a855f7" stroke-opacity=".7" stroke-width="2" stroke-dasharray="10 18">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="10" fill="url(#textGrad)">
      <animate attributeName="r" values="9;12;9" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#0b1020"/>
  </g>

  <text x="130" y="112" font-size="58" font-weight="700" fill="url(#textGrad)" letter-spacing="-1.5">Nima Asbagh</text>
  <text x="132" y="152" font-size="19" fill="#9fb3d1" letter-spacing="3.5">RUST · PYTHON · TYPESCRIPT</text>
  <text x="132" y="188" font-size="16" fill="#6f83a3" letter-spacing=".3">Photo viewers, desktop gadgets and edge Workers — built small, built fast.</text>

  <rect x="72" y="205" width="1056" height="2" rx="1" fill="url(#rule)">
    <animate attributeName="opacity" values=".35;1;.35" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(1000 108)" font-size="13" fill="#8ab4ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text y="0" opacity=".9">&gt; cargo build --release</text>
    <text y="26" fill="#93f5c8" opacity=".95">
      t=0.8s
      <animate attributeName="opacity" values="0;1;1" dur="5s" repeatCount="indefinite"/>
    </text>
    <text y="52" fill="#93f5c8">
      Finished release in 12.4s
      <animate attributeName="opacity" values="0;0;1;1" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
